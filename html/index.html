<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>FKS Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D text above the players -->
    <div id="world"></div>

    <!-- chat -->
    <div id="chat" class="top-left">
        <div id="chat-log"></div>
        <div id="chat-input" class="hidden">
            <div class="ci-bar">
                <svg class="ci-quill"><use href="#i-quill" /></svg>
                <input id="ci-text" type="text" autocomplete="off" spellcheck="false">
                <button class="ci-gear" data-act="settings" aria-label="Settings"><svg><use href="#i-gear" /></svg></button>
            </div>
            <div id="ci-suggest" class="hidden"></div>
        </div>
    </div>

    <!-- chat settings -->
    <div id="settings" class="overlay hidden">
        <section class="card st-card">
            <button class="x" data-act="settings-close" aria-label="Close"><svg><use href="#i-x" /></svg></button>
            <header class="head">
                <div class="eyebrow">FKS · <span data-l="set_eyebrow"></span></div>
                <h1 data-l="set_title"></h1>
                <svg class="rule" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M2 6 Q75 3 146 6" /><path d="M154 6 Q225 9 298 6" /><path class="gem" d="M150 1 L155 6 L150 11 L145 6 Z" />
                </svg>
            </header>

            <div class="field">
                <span class="label" data-l="set_position"></span>
                <div class="seg" id="st-position">
                    <button data-pos="top-left" data-l="pos_top_left"></button>
                    <button data-pos="center-left" data-l="pos_center_left"></button>
                    <button data-pos="bottom-left" data-l="pos_bottom_left"></button>
                    <button data-pos="top-right" data-l="pos_top_right"></button>
                </div>
            </div>

            <div class="st-sliders">
                <label class="slider"><span class="label" data-l="set_width"></span><input type="range" id="st-width" min="30" max="70" step="1"><em id="st-width-v"></em></label>
                <label class="slider"><span class="label" data-l="set_font"></span><input type="range" id="st-font" min="80" max="140" step="5"><em id="st-font-v"></em></label>
                <label class="slider"><span class="label" data-l="set_opacity"></span><input type="range" id="st-opacity" min="0" max="100" step="5"><em id="st-opacity-v"></em></label>
                <label class="slider"><span class="label" data-l="set_fade"></span><input type="range" id="st-fade" min="0" max="60" step="5"><em id="st-fade-v"></em></label>
            </div>

            <div class="field st-row">
                <span class="label" data-l="set_timestamps"></span>
                <div class="seg small" id="st-time">
                    <button data-time="1" data-l="yes"></button>
                    <button data-time="0" data-l="no"></button>
                </div>
            </div>

            <div class="field">
                <span class="label" data-l="set_colors"></span>
                <div class="st-colors" id="st-colors"></div>
            </div>

            <div class="actions">
                <button class="btn ghost" data-act="settings-reset" data-l="set_reset"></button>
                <button class="btn" data-act="settings-close" data-l="set_done"></button>
            </div>
        </section>
    </div>

    <!-- player report -->
    <div id="report" class="overlay hidden">
        <section class="panel rp-panel">
            <button class="x" data-act="report-close" aria-label="Close"><svg><use href="#i-x" /></svg></button>
            <header class="head">
                <div class="eyebrow">FKS · <span data-l="rp_eyebrow"></span></div>
                <h1 id="rp-title"></h1>
                <div class="sub" id="rp-sub"></div>
                <svg class="rule" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M2 6 Q75 3 146 6" /><path d="M154 6 Q225 9 298 6" /><path class="gem" d="M150 1 L155 6 L150 11 L145 6 Z" />
                </svg>
            </header>

            <!-- new report -->
            <div id="rp-form" class="rp-body">
                <div class="field">
                    <span class="label" data-l="rp_category"></span>
                    <div class="seg cats" id="rp-cats">
                        <button data-cat="player"><svg><use href="#i-user" /></svg><span data-l="cat_player"></span></button>
                        <button data-cat="question"><svg><use href="#i-question" /></svg><span data-l="cat_question"></span></button>
                        <button data-cat="bug"><svg><use href="#i-bug" /></svg><span data-l="cat_bug"></span></button>
                    </div>
                </div>
                <div class="field">
                    <span class="label" data-l="rp_subject"></span>
                    <input class="line" id="rp-subject" type="text" autocomplete="off" spellcheck="false">
                </div>
                <div class="field grow">
                    <span class="label" data-l="rp_info"></span>
                    <textarea class="box" id="rp-info" spellcheck="false"></textarea>
                    <em class="count" id="rp-info-count"></em>
                </div>
                <div class="actions center">
                    <button class="btn" data-act="report-send" id="rp-send"><svg><use href="#i-quill" /></svg><span data-l="rp_submit"></span></button>
                </div>
            </div>

            <!-- conversation of the open report -->
            <div id="rp-thread" class="rp-body hidden">
                <div class="rp-info">
                    <span class="chip" id="rp-cat"></span>
                    <b id="rp-subject-v"></b>
                    <span class="status" id="rp-status"></span>
                </div>
                <div class="thread" id="rp-messages"></div>
                <div class="composer" id="rp-composer">
                    <input id="rp-msg" type="text" autocomplete="off" spellcheck="false">
                    <button class="btn" data-act="report-msg"><svg><use href="#i-send" /></svg></button>
                </div>
                <div class="note hidden" id="rp-note"></div>
                <div class="actions center">
                    <button class="btn ghost danger" data-act="report-cancel" id="rp-cancel" data-l="rp_cancel"></button>
                </div>
            </div>
        </section>
    </div>

    <!-- admin reports -->
    <div id="reports" class="overlay hidden">
        <section class="panel rs-panel">
            <button class="x" data-act="reports-close" aria-label="Close"><svg><use href="#i-x" /></svg></button>
            <header class="head">
                <div class="eyebrow">FKS · <span data-l="rs_eyebrow"></span></div>
                <h1 data-l="rs_title"></h1>
                <svg class="rule" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M2 6 Q75 3 146 6" /><path d="M154 6 Q225 9 298 6" /><path class="gem" d="M150 1 L155 6 L150 11 L145 6 Z" />
                </svg>
            </header>

            <div class="rs-bar">
                <nav class="tabs" id="rs-tabs">
                    <button data-tab="open"><span data-l="tab_open"></span><em id="rs-n-open"></em></button>
                    <button data-tab="mine"><span data-l="tab_mine"></span><em id="rs-n-mine"></em></button>
                    <button data-tab="all"><span data-l="tab_all"></span><em id="rs-n-all"></em></button>
                </nav>
                <button class="btn ghost small hidden" data-act="rs-back" id="rs-back"><svg><use href="#i-back" /></svg><span data-l="act_back"></span></button>
            </div>

            <div class="rs-body">
                <aside class="rs-list" id="rs-list"></aside>
                <main class="rs-detail" id="rs-detail">
                    <div class="rs-empty" id="rs-pick" data-l="rs_pick"></div>
                    <div class="rs-view hidden" id="rs-view">
                        <div class="rs-top">
                            <div>
                                <div class="kicker" id="rs-kicker"></div>
                                <h2 id="rs-subject"></h2>
                                <div class="who" id="rs-who"></div>
                            </div>
                            <span class="status" id="rs-status"></span>
                        </div>
                        <div class="rs-actions" id="rs-actions"></div>
                        <div class="thread" id="rs-messages"></div>
                        <div class="composer" id="rs-composer">
                            <input id="rs-msg" type="text" autocomplete="off" spellcheck="false">
                            <button class="btn" data-act="rs-msg"><svg><use href="#i-send" /></svg></button>
                        </div>
                        <div class="note hidden" id="rs-note"></div>
                    </div>
                </main>
            </div>
        </section>
    </div>

    <!-- filters and icons -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <filter id="ink-soft" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="3" result="n" />
                <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" />
            </filter>
        </defs>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18" /></symbol>
        <symbol id="i-quill" viewBox="0 0 24 24"><path d="M20 3 C12 4 7 9 5 17 L4 21 M20 3 C19 9 15 14 8 15 M14 7 L9 13" /></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 11.5 L21 3 L14 21 L11 13 Z M11 13 L21 3" /></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" /><path d="M12 2.5 V5.5 M12 18.5 V21.5 M2.5 12 H5.5 M18.5 12 H21.5 M5.3 5.3 L7.4 7.4 M16.6 16.6 L18.7 18.7 M5.3 18.7 L7.4 16.6 M16.6 7.4 L18.7 5.3" /><circle cx="12" cy="12" r="6.5" /></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21 C4 16 8 14 12 14 C16 14 20 16 20 21" /></symbol>
        <symbol id="i-question" viewBox="0 0 24 24"><path d="M8.5 8.5 C8.5 5.5 11 4 12.5 4 C15 4 16.5 5.8 16.5 8 C16.5 11 12.5 11.5 12.5 15" /><circle cx="12.5" cy="19.5" r=".6" /></symbol>
        <symbol id="i-bug" viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="5" ry="6.5" /><path d="M12 7.5 V20.5 M9 6 L7.5 3.5 M15 6 L16.5 3.5 M7 11 H3.5 M17 11 H20.5 M7 15.5 H3.5 M17 15.5 H20.5 M7.8 19 L5 21 M16.2 19 L19 21" /></symbol>
        <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" /><circle cx="9" cy="9" r=".9" /><circle cx="15" cy="15" r=".9" /><circle cx="15" cy="9" r=".9" /><circle cx="9" cy="15" r=".9" /></symbol>
        <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="5.5" /><path d="M12 9.5 V14.5" /></symbol>
        <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9 4 L7 20 M17 4 L15 20 M4.5 9 H20 M4 15 H19.5" /></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21 C12 21 5 14 5 9.5 C5 5.5 8 3 12 3 C16 3 19 5.5 19 9.5 C19 14 12 21 12 21 Z" /><circle cx="12" cy="9.5" r="2.5" /></symbol>
        <symbol id="i-hand" viewBox="0 0 24 24"><path d="M4 12 H16 M11 7 L16 12 L11 17 M20 4 V20" /></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 6 L3 12 L9 18 M3 12 H15 C18.5 12 21 14.5 21 18" /></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21 V3.5 M5 4 H17 L14.5 8 L17 12 H5" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5 L9.5 18 L20 6" /></symbol>
        <symbol id="i-release" viewBox="0 0 24 24"><path d="M15 4 H19 V20 H15 M10 8 L5 12 L10 16 M5 12 H15" /></symbol>
    </svg>

    <script src="app.js"></script>
</body>
</html>
